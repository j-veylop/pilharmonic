name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Validate tag
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z][0-9A-Za-z.+-]*)?$ ]]; then
            echo "release tags must look like v1.2.3 or v1.2.3-rc1, got: $tag" >&2
            exit 1
          fi
          # GITHUB_SHA names the tag object for an annotated tag, so peel both
          # sides to the commit before comparing.
          if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "tag $tag does not point at the checked out commit" >&2
            exit 1
          fi

      - name: Verify dependencies
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Check the built binaries
        run: |
          version="$GITHUB_REF_NAME"
          commit=$(git rev-parse HEAD)
          cd dist
          sha256sum -c sha256sums.txt
          # Every built binary must be listed in the checksum file.
          test "$(find . -maxdepth 1 -name 'pilharmonic_*' -type f | wc -l)" \
            -eq "$(wc -l <sha256sums.txt)"
          got=$(./"pilharmonic_${version}_$(go env GOOS)_$(go env GOARCH)" -version)
          echo "$got"
          test "$got" = "pilharmonic ${version} (${commit})"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # A re-run must replace the assets of the release it published before.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "pilharmonic $tag" \
              --generate-notes
          fi
